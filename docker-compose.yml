# Postgres local para desarrollo. En producción usa Supabase/Neon.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutriapp
      POSTGRES_PASSWORD: nutriapp
      POSTGRES_DB: nutriapp
    ports:
      - "5432:5432"
    volumes:
      - nutriapp_pgdata:/var/lib/postgresql/data

volumes:
  nutriapp_pgdata:
